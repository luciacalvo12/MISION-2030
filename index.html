<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MISIÓN 2030 · El desafío deportivo</title>
<style>
:root{--ink:#533511;--orange:#f18c22;--gold:#ffca65;--cream:#fff8e7;--line:#e9c98f;--green:#28765b}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:linear-gradient(145deg,#fff1bc,#ffc56e 55%,#ffa76b);min-height:100vh;padding:22px}.shell{max-width:1060px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:.08em}.pill{background:#fff9e9;border:1px solid var(--line);padding:8px 13px;border-radius:99px;font-size:13px}.panel{background:#fffdf5ed;border:2px solid #fff;border-radius:26px;padding:clamp(20px,4vw,38px);box-shadow:0 18px 50px #9b581a33}.hero{text-align:center}.robot{font-size:70px}h1{font-size:clamp(36px,7vw,72px);margin:8px 0;color:#d87914;line-height:1}h2{font-size:clamp(24px,4vw,34px);margin:8px 0 12px}h3{margin:0 0 10px}.lead{font-size:19px;line-height:1.5}.muted{color:#84643c}.teams,.choices,.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:22px 0}.team,.choice,.metric,.story,.result{border:2px solid var(--line);background:#fff6df;border-radius:18px;padding:18px}.team{cursor:pointer;text-align:left;color:inherit;font:inherit}.team:hover,.choice:hover{border-color:var(--orange)}.team.selected{border-color:#d57a12;background:#ffe4a8;box-shadow:0 0 0 3px #ffd184}.team .emoji{font-size:38px;display:block;margin-bottom:10px}.team strong{display:block;margin-bottom:6px}.btn{background:var(--orange);color:#402500;border:0;border-radius:13px;padding:14px 21px;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 4px 0 #c97818}.btn:hover{filter:brightness(1.04)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.secondary{background:#fff0cd;box-shadow:none;border:1px solid var(--line)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.metrics{grid-template-columns:repeat(4,1fr)}.metric{padding:13px;text-align:center}.metric b{font-size:21px;display:block}.metric span{font-size:12px}.progress{height:12px;background:#f2dfbc;border-radius:99px;overflow:hidden;margin:16px 0}.progress>div{height:100%;background:linear-gradient(90deg,#f0a326,#f16e43);transition:width .3s}.choice{cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}.choice strong{display:block;margin-bottom:8px}.choice small{display:block;line-height:1.5;color:#785936}.choice.selected{border-color:#d57a12;background:#ffe7b5}.story{line-height:1.6;margin:15px 0}.result{border-color:#94c6a5;background:#effbef;margin-top:16px}.result h3{color:var(--green)}.label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:#a96b1b}.input{width:100%;padding:13px;border:2px solid var(--line);border-radius:12px;font:inherit;background:#fff;min-height:115px;resize:vertical}input.input{min-height:0}.score{font-size:42px;font-weight:900;color:#d87914}.hidden{display:none!important}.footer{text-align:center;font-size:12px;margin:20px;color:#78552d}.summary{display:grid;grid-template-columns:1fr 1fr;gap:15px}.toast{font-weight:700;color:#a04715}.tag{display:inline-block;padding:4px 9px;border-radius:20px;background:#fff0c8;font-size:12px;margin:3px}@media(max-width:700px){.teams,.choices,.metrics,.summary{grid-template-columns:1fr}.panel{padding:18px}.metric{display:flex;justify-content:space-between;align-items:center}.metric b{font-size:19px}.top{align-items:flex-start}}
</style>
</head>
<body><div class="shell"><header class="top"><div class="brand">🤖 DEPOR-IA · MISIÓN 2030</div><div class="pill" id="headerStatus">Laboratorio del deporte del futuro</div></header><main class="panel" id="app"></main><p class="footer">Experiencia educativa · Datos y resultados ficticios · El progreso se guarda en este navegador y las respuestas se envían al profesorado cuando hay conexión.</p></div>
<script src="config.js"></script>
<script>
'use strict';
const KEY='mision2030-v1';
const teams={concello:{name:'CONCELLO 2030',emoji:'🏛️',kind:'servicio deportivo municipal',crisis:'La piscina municipal pierde usuarios, la pista deportiva tiene horarios vacíos y la ciudadanía reclama mejores servicios.',worker:'Soy Marta, administrativa del polideportivo. ¿Vais a sustituir mi trabajo por máquinas?',customer:'Soy una vecina de 68 años. La nueva reserva digital me parece complicada. ¿Me vais a dejar sin poder nadar?',marketing:'Campaña para que jóvenes y mayores vuelvan a utilizar las instalaciones municipales.',privacy:'Un proveedor propone publicar los nombres y horarios de los menores inscritos para facilitar las reservas.'},gym:{name:'GYM 2030',emoji:'🏋️',kind:'gimnasio privado',crisis:'El gimnasio pierde socios, hay horas punta saturadas y las reseñas negativas están aumentando.',worker:'Soy Álex, entrenador. Me preocupa que una IA diseñe las rutinas y nos quedemos sin trabajo.',customer:'Pago todos los meses y nunca encuentro plaza en las clases de tarde. Quiero darme de baja.',marketing:'Campaña para recuperar socios y equilibrar la asistencia entre horas punta y valle.',privacy:'Una empresa ofrece vender datos de salud y hábitos de entrenamiento de los socios a anunciantes.'},escuela:{name:'ESCUELA 2030',emoji:'🏅',kind:'escuela deportiva y extraescolares',crisis:'Las matrículas caen, las familias se quejan de los horarios y cuesta coordinar entrenadores e instalaciones.',worker:'Soy Noa, coordinadora de actividades. ¿Una aplicación decidirá mis horarios y sustituirá mi criterio?',customer:'Soy el padre de una niña de 9 años. Nadie me avisa de los cambios de entrenamiento y estoy muy enfadado.',marketing:'Campaña para captar familias con mensajes inclusivos y una oferta extraescolar accesible.',privacy:'Alguien propone usar fotos de menores y datos de rendimiento para hacer anuncios personalizados sin autorización.'}};
const levels=[{name:'La crisis deportiva',sub:'Diagnostica antes de actuar',kind:'choice'},{name:'Transformación digital',sub:'Invierte con criterio',kind:'choice'},{name:'Decisiones inteligentes',sub:'Conoce, predice, personaliza y decide con criterio',kind:'choice'},{name:'Un cliente difícil',sub:'Escucha, responde y ofrece soluciones',kind:'text'},{name:'Marketing deportivo con IA',sub:'Diseña una campaña convincente',kind:'text'},{name:'La crisis de los datos',sub:'Protege la confianza',kind:'choice'},{name:'El gran pitch 2030',sub:'Defiende tu transformación',kind:'text'}];
let state=null;let chosenTeam=null;let selected=null;let draft='';
const CLOUD=window.MISION2030_CONFIG||{};
function cloudReady(){return /^https:\/\/[^ ]+\.supabase\.co$/.test(CLOUD.url||'') && CLOUD.publishableKey && !CLOUD.publishableKey.includes('PEGA_')}
async function sendAnswer(entry){
 if(!cloudReady())throw new Error('Falta configurar config.js con Project URL y Publishable key.');
 const response=await fetch(CLOUD.url+'/rest/v1/respuestas_mision2030',{
  method:'POST',headers:{'apikey':CLOUD.publishableKey,'Content-Type':'application/json','Prefer':'return=minimal'},
  body:JSON.stringify({equipo:state.team,nivel:entry.level,respuesta:entry.decision})
 });
 if(!response.ok)throw new Error('Supabase rechazó el envío ('+response.status+').');
}

function fresh(team){return{team,level:0,budget:100000,satisfaction:50,occupancy:60,reputation:50,history:[],finished:false}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&teams[x.team]&&Number.isInteger(x.level)&&x.level>=0&&x.level<=7&&Array.isArray(x.history))state=x}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function money(n){return Math.round(n).toLocaleString('es-ES')+' €'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function clamp(x){return Math.max(0,Math.min(100,x))}
function apply(effect){state.budget=Math.max(0,state.budget+(effect.budget||0));for(const k of ['satisfaction','occupancy','reputation'])state[k]=clamp(state[k]+(effect[k]||0))}
function metrics(){return `<div class="metrics"><div class="metric"><span>💶 Presupuesto</span><b>${money(state.budget)}</b></div><div class="metric"><span>😊 Satisfacción</span><b>${state.satisfaction}/100</b></div><div class="metric"><span>📈 Ocupación</span><b>${state.occupancy}%</b></div><div class="metric"><span>⭐ Reputación</span><b>${state.reputation}/100</b></div></div>`}
function head(){const t=teams[state.team],l=levels[state.level];document.getElementById('headerStatus').textContent=t.name+' · NIVEL '+(state.level+1)+'/7';return `<div class="label">${t.emoji} ${t.name} · NIVEL ${state.level+1} DE 7</div><div class="progress"><div style="width:${(state.level/7)*100}%"></div></div><h2>${l.name}</h2><p class="muted">${l.sub}</p>${metrics()}`}
function show(){if(!state){welcome();return}if(state.finished){finale();return}selected=null;draft='';const t=teams[state.team];let html=head();if(state.level===0){html+=`<div class="story"><strong>🚨 ALERTA 2030</strong><p>${t.crisis}</p><p>DEPOR-IA: «Tenéis que elegir el primer movimiento. ¡La organización depende de vuestro equipo!»</p></div>`;html+=choices([{title:'Escuchar y analizar',desc:'Entrevistas, datos de uso y diagnóstico compartido.',effect:{budget:-5000,satisfaction:8,reputation:6},reply:'Habéis identificado las necesidades antes de decidir. Buena base para transformar.'},{title:'Lanzar descuentos masivos',desc:'Actuar rápido sin investigar las causas.',effect:{budget:-12000,occupancy:9,reputation:-3},reply:'Sube la actividad, pero el problema de fondo sigue sin resolverse.'},{title:'No cambiar nada',desc:'Esperar a que la situación se arregle sola.',effect:{satisfaction:-12,occupancy:-8,reputation:-10},reply:'La inacción empeora la confianza y la participación.'}])}
if(state.level===1){html+=`<div class="story"><strong>💻 PRESUPUESTO DE INNOVACIÓN</strong><p>Disponéis de ${money(state.budget)}. Elegid una inversión tecnológica que ayude a vuestra organización. Los costes se descontarán de verdad del presupuesto ficticio.</p></div>`;html+=choices([{title:'Plataforma de reservas y atención accesible',desc:'Coste: 25.000 €. Formación del personal y alternativa presencial.',effect:{budget:-25000,satisfaction:14,occupancy:10,reputation:5},reply:'Las reservas son más sencillas y aumenta el acceso a las actividades.'},{title:'Analítica de asistencia y previsión de demanda',desc:'Coste: 18.000 €. Datos agregados para ajustar horarios.',effect:{budget:-18000,satisfaction:5,occupancy:15,reputation:3},reply:'Aprovecháis mejor las instalaciones y los horarios.'},{title:'Pantallas y tecnología llamativa',desc:'Coste: 40.000 €. Mucha imagen, poca mejora del servicio.',effect:{budget:-40000,satisfaction:2,occupancy:3,reputation:4},reply:'La novedad llama la atención, pero el retorno es limitado.'}])}
if(state.level===2){const retos={concello:'La piscina tiene horarios con poca ocupación y otros con listas de espera. ¿Cómo utilizaríais los datos para mejorar la planificación?',gym:'Algunos socios están dejando de asistir. ¿Cómo utilizaríais los datos y la IA para mejorar su experiencia y favorecer su continuidad?',escuela:'La demanda de actividades cambia y algunos horarios no se adaptan a las familias. ¿Cómo mejoraríais la planificación?'};html+=`<div class="story"><strong>🧠 ¡ACTIVA LA INTELIGENCIA!</strong><p>${retos[state.team]}</p><p>Ya habéis elegido una inversión tecnológica. Ahora debéis decidir cómo aprovechar los datos para conocer necesidades, prever la demanda, personalizar servicios y automatizar tareas cuando tenga sentido. Recordad respetar la privacidad y mantener la supervisión humana.</p></div>`;html+=choices([{title:'Analizar, predecir y personalizar',desc:'Usar datos de asistencia y demanda para adaptar los servicios. Aplicar IA cuando aporte valor, proteger la privacidad y mantener la supervisión humana. Coste: 8.000 €.',effect:{budget:-8000,satisfaction:10,occupancy:8,reputation:7},reply:'Habéis utilizado la información para mejorar el servicio sin perder el criterio humano.'},{title:'Automatizar todas las decisiones',desc:'Dejar que un sistema decida horarios y actividades sin revisión profesional. Coste: 15.000 €.',effect:{budget:-15000,satisfaction:-6,occupancy:3,reputation:-8},reply:'La automatización aporta cierta eficiencia, pero ignorar la supervisión humana genera problemas.'},{title:'Mantener la gestión tradicional',desc:'Seguir planificando sin aprovechar los datos disponibles ni las herramientas digitales. Coste: 0 €.',effect:{satisfaction:-5,occupancy:-4,reputation:-5},reply:'Ahorráis inversión, pero perdéis oportunidades de mejorar el servicio y la experiencia de los usuarios.'}])}
if(state.level===3){html+=`<div class="story"><strong>😠 QUEJA URGENTE</strong><p>«${t.customer}»</p><p>Tu misión: responde con empatía, una solución concreta y un modo de seguimiento.</p></div>`;html+=textTask('Escribe tu respuesta al cliente…','customer')}
if(state.level===4){html+=`<div class="story"><strong>📣 DESAFÍO DE MARKETING</strong><p>${t.marketing}</p><p>DEPOR-IA os pide una propuesta con público objetivo, mensaje, canal y llamada a la acción. Podéis apoyaros en otra herramienta de IA, pero debéis revisar el resultado.</p></div>`;html+=textTask('Ejemplo: Público… Mensaje… Canal… Acción…','marketing')}
if(state.level===5){html+=`<div class="story"><strong>🔒 EMERGENCIA DE PRIVACIDAD</strong><p>${t.privacy}</p><p>Elegid qué hacer antes de que el problema afecte a las personas.</p></div>`;html+=choices([{title:'Detener la propuesta y revisar permisos',desc:'Minimizar datos, informar, proteger a menores y consultar a la persona responsable de privacidad.',effect:{budget:-3000,satisfaction:6,reputation:16},reply:'Habéis protegido la confianza y reducido los riesgos.'},{title:'Usar los datos porque son útiles',desc:'Priorizar resultados sin comprobar base legal ni consentimiento.',effect:{budget:2000,satisfaction:-18,reputation:-25},reply:'La decisión provoca una crisis de confianza. Los datos personales exigen garantías.'},{title:'Ocultar el problema',desc:'No informar ni revisar la práctica.',effect:{satisfaction:-12,reputation:-20},reply:'La falta de transparencia empeora la situación.'}])}
if(state.level===6){html+=`<div class="story"><strong>🏆 CONSEJO DIRECTIVO 2030</strong><p>Preparad un pitch final: ¿qué problema resolvisteis, qué tecnología elegisteis, cómo cuidasteis a las personas y qué haréis a continuación?</p><p>Tenéis un minuto para presentarlo al resto de la clase.</p></div>`;html+=textTask('Nuestro problema era… Elegimos… Protegimos… Próximo paso…','pitch')}
document.getElementById('app').innerHTML=html;bind()}
function choices(options){window.currentOptions=options;return `<div class="choices">${options.map((o,i)=>`<button class="choice" data-choice="${i}" ${state.budget+(o.effect.budget||0)<0?'disabled':''}><strong>${i+1}. ${esc(o.title)}</strong><small>${esc(o.desc)}</small></button>`).join('')}</div><div id="feedback"></div><div class="actions"><button class="btn" id="confirm" disabled>Confirmar decisión →</button></div>`}
function textTask(placeholder,kind){window.currentOptions=null;window.currentKind=kind;return `<textarea id="response" class="input" maxlength="1200" placeholder="${esc(placeholder)}" aria-label="Respuesta del equipo"></textarea><p class="muted">Mínimo 30 caracteres. Se valorarán criterios educativos; esto no es una conversación con IA real.</p><div id="feedback"></div><div class="actions"><button class="btn" id="confirm">Enviar respuesta →</button></div>`}
function bind(){document.querySelectorAll('[data-choice]').forEach(el=>el.addEventListener('click',()=>{selected=Number(el.dataset.choice);document.querySelectorAll('[data-choice]').forEach(e=>e.classList.remove('selected'));el.classList.add('selected');document.getElementById('confirm').disabled=false}));document.getElementById('confirm').addEventListener('click',submitDecision)}
function evaluate(text,kind){const s=text.toLowerCase();const groups={employee:[['entiendo','comprendo','preocup','escuch','empat'],['formaci','capacita','aprend','acompañ'],['equipo','particip','juntos','decidir','supervis','humano']],customer:[['siento','disculp','entiendo','comprendo','lamento'],['soluci','alternativa','reserva','horario','plaza','ayuda','atenci'],['contact','seguim','avis','llam','revis','respuesta']],marketing:[['familia','jóven','mayor','socio','público','personas','niñ'],['instagram','cartel','correo','web','redes','colegio','whatsapp'],['inscr','reserva','ven','apunta','prueba','particip','únete']],pitch:[['problema','crisis','necesidad','objetivo'],['tecnolog','datos','digital','ia','reserva','analít'],['persona','privacidad','equipo','ética','formaci','inclus'],['futuro','próximo','siguiente','medir','mejora']]};const hits=groups[kind].filter(g=>g.some(w=>s.includes(w))).length;return{hits,total:groups[kind].length}}
async function submitDecision(){const feedback=document.getElementById('feedback'),button=document.getElementById('confirm');if(button.dataset.done==='1'){state.level++;if(state.level>=7)state.finished=true;save();show();return}const before={budget:state.budget,satisfaction:state.satisfaction,occupancy:state.occupancy,reputation:state.reputation};let entry;if(window.currentOptions){if(selected===null)return;const o=window.currentOptions[selected];apply(o.effect);entry={level:state.level+1,decision:o.title,reply:o.reply};feedback.innerHTML=`<div class="result"><h3>🤖 DEPOR-IA RESPONDE</h3><p>${esc(o.reply)}</p><p><strong>Los indicadores han cambiado.</strong></p></div>`}else{const text=document.getElementById('response').value.trim();if(text.length<30){feedback.innerHTML='<p class="toast">Escribid al menos 30 caracteres para continuar.</p>';return}const kind=window.currentKind,ev=evaluate(text,kind),good=ev.hits>=Math.ceil(ev.total*.75);const effect=kind==='employee'?(good?{satisfaction:8,reputation:5}:{satisfaction:2}):kind==='customer'?(good?{satisfaction:12,reputation:6}:{satisfaction:3}):kind==='marketing'?(good?{budget:-7000,occupancy:12,reputation:7}:{budget:-7000,occupancy:4}):(good?{reputation:8,satisfaction:4}:{reputation:2});apply(effect);const note=good?'Vuestra propuesta incluye varios elementos importantes.':'Habéis avanzado, pero podéis concretar mejor la empatía, las acciones o los compromisos.';entry={level:state.level+1,decision:text,reply:note};feedback.innerHTML=`<div class="result"><h3>🤖 Evaluación orientativa</h3><p>${note}</p><p>Elementos detectados: ${ev.hits} de ${ev.total}. La profesora o el profesor puede valorar vuestra respuesta con más profundidad.</p></div>`;document.getElementById('response').disabled=true}button.disabled=true;button.textContent='Enviando al profesor…';
 try{await sendAnswer(entry)}catch(error){
  console.error(error);Object.assign(state,before);const responseBox=document.getElementById('response');if(responseBox)responseBox.disabled=false;feedback.insertAdjacentHTML('beforeend',`<p class="toast">⚠️ No se ha enviado al profesor: ${esc(error.message)} Comprueba la conexión o avisa al profesor y vuelve a pulsar Enviar.</p>`);
  button.disabled=false;button.textContent='Reintentar envío →';return;
 }
 feedback.insertAdjacentHTML('beforeend','<p class="muted">✅ Respuesta recibida en el panel del profesor.</p>');
 state.history.push(entry);save();button.dataset.done='1';button.textContent=state.level===6?'Ver resultados finales 🏆':'Continuar al siguiente nivel →';button.disabled=false;document.querySelectorAll('[data-choice]').forEach(e=>e.disabled=true);const m=document.querySelector('.metrics');if(m)m.outerHTML=metrics()}
function welcome(){document.getElementById('headerStatus').textContent='Elige tu organización';document.getElementById('app').innerHTML=`<section class="hero"><div class="robot">🤖</div><div class="label">El futuro del deporte está en tus manos</div><h1>MISIÓN 2030</h1><p class="lead">3 equipos · 7 niveles · Decisiones que cambian el futuro</p><p class="muted">Cada equipo debe usar su propio dispositivo. Selecciona la organización que te ha asignado el profesorado.</p></section><div class="teams">${Object.entries(teams).map(([id,t])=>`<button class="team ${chosenTeam===id?'selected':''}" data-team="${id}"><span class="emoji">${t.emoji}</span><strong>${t.name}</strong><span>${t.kind}</span></button>`).join('')}</div><div class="story"><strong>🎯 Tu misión</strong><p>Comienzas con 100.000 € ficticios, satisfacción 50/100, ocupación 60 % y reputación 50/100. Tus decisiones modificarán estos indicadores.</p></div><div class="actions"><button id="start" class="btn" ${chosenTeam?'':'disabled'}>🚀 COMENZAR MISIÓN</button></div>`;document.querySelectorAll('[data-team]').forEach(b=>b.addEventListener('click',()=>{chosenTeam=b.dataset.team;welcome()}));document.getElementById('start').addEventListener('click',()=>{if(!chosenTeam)return;state=fresh(chosenTeam);save();show()})}
function finale(){const t=teams[state.team];document.getElementById('headerStatus').textContent='Misión completada';const score=Math.round((state.satisfaction+state.occupancy+state.reputation)/3);const title=score>=75?'Líderes del cambio':score>=55?'Transformación en marcha':'Una misión para seguir mejorando';document.getElementById('app').innerHTML=`<div class="hero"><div class="robot">🏆</div><div class="label">MISIÓN COMPLETADA</div><h1>${t.name}</h1><h2>${title}</h2><p>Habéis superado los siete niveles.</p><div class="score">${score}/100</div><p class="muted">Índice educativo: media de satisfacción, ocupación y reputación. El presupuesto se muestra aparte.</p></div>${metrics()}<h3>📋 Vuestras decisiones</h3><div class="summary">${state.history.map((h,i)=>`<div class="story"><span class="label">Nivel ${i+1}</span><strong style="display:block">${esc(levels[i].name)}</strong><p>${esc(h.decision)}</p></div>`).join('')}</div><div class="story"><strong>🎤 Presentación final</strong><p>Explicad al resto de equipos qué habéis aprendido, qué decisión cambiaríais y cómo usaríais la IA con responsabilidad.</p></div><div class="actions"><button class="btn secondary" id="print">🖨️ Imprimir resultados</button><button class="btn" id="restart">↻ Nueva partida</button></div>`;document.getElementById('print').onclick=()=>window.print();document.getElementById('restart').onclick=()=>{if(window.confirm('¿Seguro que quieres borrar el progreso de este dispositivo?')){localStorage.removeItem(KEY);state=null;chosenTeam=null;welcome()}}}
try { load(); show(); } catch (error) { console.error('Error al iniciar MISIÓN 2030:',error); localStorage.removeItem(KEY); state=null; try { welcome(); } catch(e) { document.getElementById('app').innerHTML='<h1>🤖 MISIÓN 2030</h1><p>Ha ocurrido un error al iniciar el juego. Actualiza la página.</p>'; console.error(e); } }
</script></body></html>
