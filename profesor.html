
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MISIÓN 2030 · Panel del profesor</title>
<style>
:root{font-family:system-ui,sans-serif;color:#513312;background:#fff2d3}
body{margin:0;padding:22px}
main{max-width:1050px;margin:auto}
h1{color:#d57b17}
section{background:white;border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 6px 25px #a66d3020}
input,button{font:inherit;padding:11px;margin:5px;border-radius:10px;border:1px solid #dcb77c}
button{background:#f6a133;cursor:pointer;font-weight:bold}
button:disabled{opacity:.5;cursor:wait}
.danger{background:#d93025;color:white}
.entry{border-top:1px solid #ecd9b8;padding:12px 0}
.meta{color:#806244;font-size:13px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}
.hidden{display:none}
#status{font-weight:bold}
.columns{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:750px){.columns{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>🤖 MISIÓN 2030 · Profesorado</h1>
<p>Respuestas de los equipos, actualizadas cada 5 segundos.</p>

<section id="login">
<h2>Acceso del profesorado</h2>
<input id="email" type="email" placeholder="Correo del profesor" autocomplete="username">
<input id="password" type="password" placeholder="Contraseña" autocomplete="current-password">
<button id="enter">Entrar</button>
</section>

<section id="board" class="hidden">
<button id="logout">Cerrar sesión</button>
<button id="refresh">Actualizar ahora</button>
<button id="clearAll" class="danger">🗑️ Borrar todas las respuestas</button>
<p id="summary"></p>
<div id="teams" class="columns"></div>
</section>

<p id="status" role="status"></p>
</main>

<script src="config.js?v=20261103c"></script>
<script>
'use strict';

const cfg=window.MISION2030_CONFIG||{};
let token=null,timer=null;
const $=id=>document.getElementById(id);

function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;',
    '"':'&quot;',"'":'&#39;'
  }[c]));
}

function msg(s){$('status').textContent=s}

function ready(){
  return cfg.url?.startsWith('https://')
    &&cfg.publishableKey
    &&!cfg.publishableKey.includes('PEGA_');
}

async function request(path,options={}){
  const headers={
    'apikey':cfg.publishableKey,
    'Content-Type':'application/json',
    ...(token?{'Authorization':'Bearer '+token}:{})
  };
  const res=await fetch(cfg.url+path,{
    ...options,
    headers:{...headers,...options.headers}
  });
  const data=await res.json().catch(()=>null);
  if(!res.ok){
    throw Error(
      data?.message||
      data?.msg||
      data?.error_description||
      data?.details||
      ('Error '+res.status)
    );
  }
  return data;
}

async function login(){
  if(!ready()){
    msg('Falta configurar config.js.');
    return;
  }
  try{
    const data=await request(
      '/auth/v1/token?grant_type=password',
      {
        method:'POST',
        body:JSON.stringify({
          email:$('email').value.trim(),
          password:$('password').value
        })
      }
    );
    token=data.access_token;
    $('password').value='';
    $('login').classList.add('hidden');
    $('board').classList.remove('hidden');
    await refresh();
    timer=setInterval(refresh,5000);
  }catch(e){
    msg('No se pudo entrar: '+e.message);
  }
}

async function refresh(){
  if(!token)return;
  try{
    const data=await request(
      '/rest/v1/respuestas_mision2030?select=equipo,nivel,respuesta,creado_en&order=creado_en.desc&limit=300'
    );
    const names={
      concello:'🏛️ CONCELLO 2030',
      gym:'🏋️ GYM 2030',
      escuela:'🏅 ESCUELA 2030'
    };
    $('summary').textContent=
      data.length+' respuestas recibidas (máximo 300 recientes).';

    $('teams').innerHTML=Object.entries(names).map(([key,name])=>{
      const items=data.filter(x=>x.equipo===key);
      return `<section>
        <h2>${name}</h2>
        <p>${items.length} respuestas</p>
        ${items.map(x=>`
          <div class="entry">
            <div class="meta">
              Nivel ${Number(x.nivel)} ·
              ${esc(new Date(x.creado_en).toLocaleString('es-ES'))}
            </div>
            <pre>${esc(x.respuesta)}</pre>
          </div>
        `).join('')||'<p>Todavía no hay respuestas.</p>'}
      </section>`;
    }).join('');

    msg('Conectado · última actualización '+
      new Date().toLocaleTimeString('es-ES'));
  }catch(e){
    msg('No se pudieron cargar las respuestas: '+e.message);
  }
}

async function clearAll(){
  if(!token){
    msg('Primero inicia sesión como profesora.');
    return;
  }

  if(!confirm(
    '¿Borrar TODAS las respuestas de los tres equipos? Esta acción no se puede deshacer.'
  ))return;

  if(!confirm(
    'Última confirmación: ¿eliminar definitivamente todas las respuestas?'
  ))return;

  const button=$('clearAll');
  button.disabled=true;

  try{
    const result=await request(
      '/rest/v1/rpc/borrar_respuestas_mision2030',
      {method:'POST',body:'{}'}
    );
    await refresh();
    msg('Se han borrado '+Number(result)+
      ' respuestas. Ya puedes comenzar una nueva sesión.');
  }catch(e){
    msg('ERROR AL BORRAR: '+e.message);
  }finally{
    button.disabled=false;
  }
}

$('enter').onclick=login;
$('password').addEventListener('keydown',e=>{
  if(e.key==='Enter')login();
});
$('refresh').onclick=refresh;
$('clearAll').onclick=clearAll;
$('logout').onclick=()=>{
  token=null;
  clearInterval(timer);
  $('board').classList.add('hidden');
  $('login').classList.remove('hidden');
  msg('Sesión cerrada');
};

if(!ready())msg('Falta completar config.js antes de usar el panel.');
</script>
</body>
</html>
